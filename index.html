<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TheraPay - ניהול קליניקה</title>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-card: #1e293b;
            --bg-card-hover: #334155;
            --accent-teal: #14b8a6;
            --accent-teal-hover: #0d9488;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --danger: #ef4444;
            --warning: #f59e0b;
            --success: #10b981;
            --whatsapp-green: #25d366;
            --morning-green: #00c853;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Heebo', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background-color: var(--bg-primary); 
            color: var(--text-main); 
            display: flex; 
            height: 100vh; 
            height: 100dvh;
            overflow: hidden; 
        }

        .sidebar { 
            width: 250px; 
            background-color: #090d16; 
            border-left: 1px solid var(--border-color); 
            display: flex; 
            flex-direction: column; 
            padding: 20px; 
            flex-shrink: 0; 
            z-index: 1001;
            transition: right 0.3s ease;
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
        }

        .brand { 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            font-size: 1.35rem; 
            font-weight: 700; 
            color: var(--accent-teal); 
        }

        .close-drawer-btn {
            display: none;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 4px;
        }

        .nav-items { 
            display: flex; 
            flex-direction: column; 
            gap: 8px; 
            flex: 1; 
            overflow-y: auto; 
        }

        .nav-btn { 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            padding: 12px 14px; 
            border-radius: 10px; 
            color: var(--text-muted); 
            background: transparent; 
            border: none; 
            font-size: 0.95rem; 
            font-weight: 500;
            cursor: pointer; 
            text-align: right; 
            width: 100%; 
            transition: all 0.2s ease; 
        }

        .nav-btn:hover, .nav-btn.active { 
            background-color: var(--accent-teal); 
            color: #fff; 
            font-weight: 600;
        }

        .drawer-backdrop {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(3px);
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .drawer-backdrop.active { display: block; opacity: 1; }

        .main-content { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            overflow-y: auto; 
            padding: 20px 25px; 
        }

        .header-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #131c2e;
            padding: 12px 18px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
            gap: 15px;
        }

        .header-right { display: flex; align-items: center; gap: 12px; }

        .hamburger-btn {
            display: none;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            font-size: 1.4rem;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
        }

        .header-title { font-size: 1.25rem; font-weight: 700; color: var(--text-main); }
        .header-left { display: flex; align-items: center; gap: 10px; }

        .header-sync-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            border-radius: 20px;
            background: rgba(59, 130, 246, 0.15);
            border: 1px solid #3b82f6;
            color: #60a5fa;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .header-sync-btn.connected {
            background: rgba(16, 185, 129, 0.15);
            border-color: var(--success);
            color: var(--success);
        }

        .dashboard-quick-actions {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 10px;
            margin-bottom: 20px;
        }

        .btn-primary-action {
            background: linear-gradient(135deg, #14b8a6 0%, #0d9488 100%);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            padding: 14px 18px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 14px rgba(20, 184, 166, 0.3);
            transition: all 0.2s ease;
            min-height: 52px;
        }

        .btn-action, .btn-pay, .btn-whatsapp, .btn-morning {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 10px 16px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.9rem;
            border: none;
            cursor: pointer;
            transition: transform 0.1s ease, opacity 0.2s ease;
            text-decoration: none;
            min-height: 42px;
        }

        .btn-action { background-color: var(--accent-teal); color: #fff; }
        .btn-action:hover { background-color: var(--accent-teal-hover); }
        .btn-pay { background-color: var(--success); color: #fff; }
        .btn-whatsapp { background-color: var(--whatsapp-green); color: #fff; }
        .btn-morning { background-color: var(--morning-green); color: #fff; }

        .cards-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); 
            gap: 15px; 
            margin-bottom: 20px; 
        }

        .card { 
            background-color: var(--bg-card); 
            border: 1px solid var(--border-color); 
            border-radius: 14px; 
            padding: 16px; 
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .card-title { font-size: 0.82rem; color: var(--text-muted); margin-bottom: 4px; font-weight: 500; }
        .card-value { font-size: 1.5rem; font-weight: 700; color: var(--accent-teal); }

        .filter-box { 
            background: var(--bg-card); 
            padding: 12px 16px; 
            border-radius: 12px; 
            border: 1px solid var(--border-color); 
            margin-bottom: 20px; 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            flex-wrap: wrap; 
        }

        .filter-group { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 140px; }
        .filter-group label { font-size: 0.85rem; color: var(--text-muted); font-weight: 600; white-space: nowrap; }
        .filter-group select { 
            width: 100%; 
            padding: 9px 12px; 
            border-radius: 8px; 
            border: 1px solid var(--border-color); 
            background: var(--bg-primary); 
            color: #fff; 
            font-size: 15px; 
            height: 40px;
        }

        .batch-bar {
            background-color: #162032;
            border: 1px solid var(--accent-teal);
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .batch-info { font-size: 0.92rem; font-weight: 600; color: var(--text-main); }
        .batch-actions { display: flex; gap: 8px; }

        .table-container { 
            background-color: var(--bg-card); 
            border-radius: 12px; 
            border: 1px solid var(--border-color); 
            overflow-x: auto; 
            -webkit-overflow-scrolling: touch;
        }

        table { width: 100%; border-collapse: collapse; min-width: 520px; }
        th, td { text-align: right; padding: 12px 14px; border-bottom: 1px solid var(--border-color); font-size: 0.88rem; }
        th { color: var(--text-muted); font-size: 0.8rem; background-color: #162032; font-weight: 600; white-space: nowrap; }
        tr:hover { background-color: var(--bg-card-hover); }

        input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent-teal); cursor: pointer; }

        .badge { padding: 4px 10px; border-radius: 20px; font-size: 0.78rem; font-weight: 600; display: inline-block; }
        .badge-success { background: rgba(16, 185, 129, 0.2); color: var(--success); }
        .badge-warning { background: rgba(245, 158, 11, 0.2); color: var(--warning); }

        .tab-section { display: none; }
        .tab-section.active { display: block; }

        .modal { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.85); justify-content: center; align-items: center; 
            z-index: 9999; padding: 15px; 
        }

        .modal-content { 
            background: var(--bg-card); padding: 22px; border-radius: 16px; width: 100%; 
            max-width: 460px; max-height: 90vh; overflow-y: auto; border: 1px solid var(--border-color); 
            box-shadow: 0 20px 30px rgba(0,0,0,0.6); 
        }

        .modal-title { font-size: 1.15rem; margin-bottom: 14px; color: var(--text-main); font-weight: 700; }
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; margin-bottom: 6px; color: var(--text-muted); font-size: 0.85rem; font-weight: 500; }
        .form-group input, .form-group select, .form-group textarea { 
            width: 100%; padding: 11px; border-radius: 8px; border: 1px solid var(--border-color); 
            background: var(--bg-primary); color: #fff; font-size: 16px; 
        }

        @media (max-width: 768px) {
            body { flex-direction: column; height: 100dvh; }
            .sidebar { position: fixed; top: 0; right: -280px; width: 260px; height: 100%; box-shadow: -10px 0 30px rgba(0, 0, 0, 0.7); }
            .sidebar.open { right: 0; }
            .close-drawer-btn, .hamburger-btn { display: block; }
            .main-content { padding: 12px; }
            .cards-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .filter-box { padding: 10px; flex-direction: column; }
            .filter-group { width: 100%; }
            .batch-bar { flex-direction: column; align-items: stretch; }
            .batch-actions { width: 100%; display: grid; grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>

    <div class="drawer-backdrop" id="drawerBackdrop" onclick="closeDrawer()"></div>

    <div class="sidebar" id="sidebarDrawer">
        <div class="sidebar-header">
            <div class="brand">⚡ TheraPay</div>
            <button class="close-drawer-btn" type="button" onclick="closeDrawer()">✕</button>
        </div>
        <div class="nav-items">
            <button class="nav-btn active" id="btn-dashboard" type="button" onclick="switchTab('dashboard')">📊 דשבורד</button>
            <button class="nav-btn" id="btn-patients" type="button" onclick="switchTab('patients')">👥 מטופלים</button>
            <button class="nav-btn" id="btn-appointments" type="button" onclick="switchTab('appointments')">📅 פגישות</button>
            <button class="nav-btn" id="btn-payments" type="button" onclick="switchTab('payments')">💳 תשלומים</button>
            <button class="nav-btn" id="btn-whatsapp" type="button" onclick="switchTab('whatsapp')">📲 WhatsApp</button>
            <button class="nav-btn" id="btn-morning" type="button" onclick="switchTab('morning')">🧾 Morning</button>
            <button class="nav-btn" id="btn-reports" type="button" onclick="switchTab('reports')">📈 דוחות</button>
        </div>
    </div>

    <div class="main-content">
        <div class="header-bar">
            <div class="header-right">
                <button class="hamburger-btn" type="button" onclick="toggleDrawer()">☰</button>
                <div class="header-title" id="pageTitle">דשבורד ראשי</div>
            </div>
            <div class="header-left">
                <button class="header-sync-btn" id="headerSyncBtn" type="button" onclick="openSyncModal()">
                    <span id="syncBadgeIcon">☁️</span>
                    <span id="syncBadgeText">סנכרון Sheets</span>
                </button>
            </div>
        </div>

        <!-- דשבורד -->
        <div id="tab-dashboard" class="tab-section active">
            <div class="cards-grid">
                <div class="card"><div class="card-title">מטופלים פעילים</div><div class="card-value" id="statActivePatients">0</div></div>
                <div class="card"><div class="card-title">פגישות החודש</div><div class="card-value" id="statThisMonthApps">0</div></div>
                <div class="card"><div class="card-title">פגישות חודש שעבר</div><div class="card-value" id="statLastMonthApps">0</div></div>
                <div class="card"><div class="card-title">סה"כ נגבה (כולל מע"מ)</div><div class="card-value" style="color:var(--success)" id="statMonthRevenue">₪0</div></div>
                <div class="card"><div class="card-title">
